# @package _global_
defaults:
  - /experiment/example/based-360m.yaml

datamodule:
  batch_size: 4  # per gpu
  batch_size_eval: 4

expt_name: 04-15-based-360m
name: ${.expt_name}

trainer:
  max_steps: -1
  max_epochs: 3

train:
  global_batch_size: 4

callbacks:
  model_checkpoint:
    dirpath: /home/lyj/project/based/checkpoints/${expt_name}
    every_n_train_steps: 5000
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: "val/loss"
    mode: "min"
    patience: 4
    min_delta: 0.01